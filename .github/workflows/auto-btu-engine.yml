name: Autonomous Mini-Split BTU & SEER2 Sizing Engine

on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_system:
        description: 'Optional Mini-Split Model or Room (e.g. MRCOOL DIY 24000 BTU)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-btu-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build BTU Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_SYSTEM: ${{ github.event.inputs.custom_system || '' }}
        run: |
          python engine/btu_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_systems.json
          if git diff --staged --quiet; then
            echo "No new HVAC BTU pages to commit."
          else
            git commit -m "chore(hvac): auto-publish new mini-split BTU & SEER2 calculators"
            git push origin main
          fi
